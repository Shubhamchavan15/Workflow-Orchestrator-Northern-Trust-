version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: orchestrator_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - orchestrator_net

  n8n:
    image: n8nio/n8n:1.0.0
    container_name: orchestrator_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - orchestrator_net

  payment-service:
    build:
      context: ./payment-service
    container_name: mock_payment_service
    ports:
      - "8001:8001"
    networks:
      - orchestrator_net

  inventory-service:
    build:
      context: ./inventory-service
    container_name: mock_inventory_service
    ports:
      - "8002:8002"
    networks:
      - orchestrator_net

  shipping-service:
    build:
      context: ./shipping-service
    container_name: mock_shipping_service
    ports:
      - "8003:8003"
    networks:
      - orchestrator_net

  notification-service:
    build:
      context: ./notification-service
    container_name: mock_notification_service
    ports:
      - "8004:8004"
    networks:
      - orchestrator_net

  orchestrator-backend:
    build:
      context: ./orchestrator-backend
    container_name: orchestrator_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=workflow_orchestrator
      - PAYMENT_SERVICE_URL=http://payment-service:8001/process
      - INVENTORY_SERVICE_URL=http://inventory-service:8002/check
      - SHIPPING_SERVICE_URL=http://shipping-service:8003/dispatch
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004/send
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook-test/order-notification
    depends_on:
      - mongodb
    networks:
      - orchestrator_net

  frontend-dashboard:
    build:
      context: ./frontend-dashboard
    container_name: frontend_dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - orchestrator-backend
    networks:
      - orchestrator_net

  frontend-user:
    build:
      context: ./frontend-user
    container_name: frontend_user
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - orchestrator-backend
    networks:
      - orchestrator_net

volumes:
  mongodb_data:
  n8n_data:

networks:
  orchestrator_net:
    driver: bridge
